name: CI

on:
  push:
    branches: ['**']
  pull_request:

# One run per ref. A superseded run is wasted minutes on a slow software render.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node checks in one job and the browser half in three shards, all in
# parallel, with one required Browser job summing the shards. The split is the point: almost all the
# wall clock is Chromium — downloading it, booting it, and rendering in software
# on a runner with no GPU — and almost all the signal is in the half that needs
# none of that. A gate slow enough to be resented is a gate that gets bypassed.
# See issue #25.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install harness dependencies
        working-directory: tools
        run: npm ci

      # Bundle sync, pinned arithmetic, generation, the movement budget, the
      # camera and input table, and a five-minute soak on every golden seed —
      # all of it without a browser, in a couple of seconds.
      - name: Node checks
        run: node tools/smoke.mjs --node

  # The browser half in three shards, side by side. It had grown to 22 minutes
  # in one job (e923cdd: build 634 s, worker 467 s, the other five 234 s), and
  # every group already runs on its own with --only. Each shard boots its own
  # Chromium; nothing is dropped from the gate. Split by measured time, so the
  # wall clock is the slowest shard's, not the sum.
  browser-shard:
    name: Browser (${{ matrix.groups }})
    runs-on: ubuntu-latest
    # The limit is for a hang, not for a slow runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        groups: ['build', 'worker', 'boot,render,stream,magma,look']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install harness dependencies
        working-directory: tools
        run: npm ci

      # playwright-core ships no browser; install one matching its version.
      # tools/lib/harness.mjs then resolves the path itself — do not glob for it,
      # the layout is chrome-linux64/ on current revisions and chrome-linux/ on older.
      # The browser itself is cached by that version; the system libraries it
      # needs are not, and are installed every time.
      - name: Cache Chromium
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-${{ runner.os }}
      - name: Install Chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx --yes playwright@1.63.0 install chromium
      - name: Install Chromium's system libraries
        run: npx --yes playwright@1.63.0 install-deps chromium

      # Renders in software here, so this asserts correctness and proxy metrics
      # only. Real frame rate is checked by hand on a GPU — see docs/PROTOTYPE.md.
      - name: Browser checks
        run: node tools/smoke.mjs --browser --only=${{ matrix.groups }}

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ strategy.job-index }}
          path: .render/*.png
          if-no-files-found: ignore

  # One check named Browser, as before, so whatever requires it by name still
  # finds it: green only when every shard is.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    needs: browser-shard
    if: always()
    steps:
      - name: Every shard passed
        run: |
          test "${{ needs.browser-shard.result }}" = "success" || { echo "a browser shard did not pass: ${{ needs.browser-shard.result }}"; exit 1; }
